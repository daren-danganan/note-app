<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/marked.js"></script>
    <script type="module" src="app.js" defer></script>
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <input id="search-input" type="search" placeholder="Search notes…" autocomplete="off" />
          <button id="new-note-btn" title="New note" aria-label="New note">+</button>
        </div>
        <ul id="note-list" class="note-list"></ul>
      </aside>

      <main class="editor-pane">
        <div class="editor-toolbar">
          <button id="toggle-preview-btn">Edit</button>
          <button id="delete-note-btn">Delete</button>
          <span id="save-status" class="save-status"></span>
        </div>
        <div class="editor-split">
          <textarea
            id="editor"
            class="editor hidden"
            placeholder="Start writing in markdown…"
            spellcheck="false"
          ></textarea>
          <div id="preview" class="preview"></div>
        </div>
      </main>
    </div>

    <div id="confirm-dialog" class="confirm-overlay hidden">
      <div class="confirm-box">
        <p id="confirm-dialog-message"></p>
        <div class="confirm-actions">
          <button id="confirm-dialog-cancel">Cancel</button>
          <button id="confirm-dialog-ok" class="danger">Delete</button>
        </div>
      </div>
    </div>

    <div id="command-palette" class="palette-overlay hidden">
      <div class="palette-box">
        <input
          id="palette-input"
          type="text"
          class="palette-input"
          placeholder="Insert a markdown element or start a new note…"
          autocomplete="off"
          spellcheck="false"
        />
        <ul id="palette-list" class="palette-list"></ul>
      </div>
    </div>
  </body>
</html>
